site_name: Ripster
site_description: Benutzerhandbuch für den Betrieb von Ripster mit technischem Anhang
site_author: Michael
site_url: https://mboehmlaender.github.io/ripster/

repo_name: ripster
repo_url: https://github.com/mboehmlaender/ripster
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus aktivieren
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Hellmodus aktivieren
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github
    logo: material/disc

nav:
  - Home: index.md
  - Benutzerhandbuch:
    - getting-started/index.md
    - Voraussetzungen: getting-started/prerequisites.md
    - Installation: getting-started/installation.md
    - Ersteinrichtung: getting-started/configuration.md
    - Erster Lauf: getting-started/quickstart.md
    - GUI-Seiten:
      - gui/index.md
      - Ripper: gui/ripper.md
      - Hardware: gui/hardware.md
      - Audiobooks: gui/audiobooks.md
      - Settings: gui/settings.md
      - Historie: gui/history.md
      - Converter: gui/converter.md
      - Downloads: gui/downloads.md
      - Database (Expert): gui/database.md
      - TMDb Migration: gui/tmdb-migration.md
    - Workflows aus Nutzersicht: workflows/index.md
  - Technischer Anhang:
    - appendix/index.md
    - Lizenzierung: appendix/licensing.md
    - Konfiguration:
      - configuration/index.md
      - Alle Einstellungen: configuration/settings-reference.md
      - Umgebungsvariablen: configuration/environment.md
    - Pipeline intern:
      - pipeline/index.md
      - Workflow & Zustände: pipeline/workflow.md
      - Encode-Planung & Track-Auswahl: pipeline/encoding.md
      - Playlist-Analyse: pipeline/playlist-analysis.md
      - Encode-Skripte (Pre & Post): pipeline/post-encode-scripts.md
    - API-Referenz:
      - api/index.md
      - Pipeline API: api/pipeline.md
      - Settings API: api/settings.md
      - History API: api/history.md
      - Cron API: api/crons.md
      - Converter API: api/converter.md
      - Downloads API: api/downloads.md
      - Runtime Activities API: api/runtime-activities.md
      - WebSocket Events: api/websocket.md
    - Architektur:
      - architecture/index.md
      - Übersicht: architecture/overview.md
      - Backend-Services: architecture/backend.md
      - Frontend-Komponenten: architecture/frontend.md
      - Datenbank: architecture/database.md
    - Deployment:
      - deployment/index.md
      - Entwicklungsumgebung: deployment/development.md
      - Produktion: deployment/production.md
      - Release-Prozess: development/releasing.md
    - Externe Tools:
      - tools/index.md
      - MakeMKV: tools/makemkv.md
      - HandBrake: tools/handbrake.md
      - MediaInfo: tools/mediainfo.md

plugins:
  - search:
      lang: de
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mboehmlaender/ripster
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css
